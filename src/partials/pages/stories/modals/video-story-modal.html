<div id="video-story-modal" class="modal video-story-modal is-medium has-light-bg">
    <div class="modal-background"></div>
    <div class="modal-content">

        <div class="card">
            <div class="card-heading">
                <div class="small-avatar">
                    <img class="avatar" src="https://via.placeholder.com/150x150"
                        data-demo-src="assets/img/avatars/jenna.png" data-user-popover="0" alt="">
                </div>
                <h3>Video Story</h3>
                <!-- Close X button -->
                <div class="close-wrap">
                    <span class="close-modal">
                        <i data-feather="x"></i>
                    </span>
                </div>
            </div>
            <div class="card-body">
                <div class="columns">
                    <div class="column is-6">
                        <div class="story-meta">
                            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Urgent tamen et nihil remittunt.
                                Sed nimis multa. Sed plane dicit quod intellegit.</p>
                            <div class="field">
                                <div class="control">
                                    <input type="text" class="input" placeholder="Something">
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <textarea class="textarea" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <select class="demo" multiple>
                                        <option value="1">Acura</option>
                                        <option value="2">Audi</option>
                                        <option value="3">BMW</option>
                                        <option value="4">Cadillac</option>
                                        <option value="5">Chevrolet</option>
                                        <option value="6">Ferrari</option>
                                        <option value="7">Ford</option>
                                        <option value="8">Honda</option>
                                        <option value="9">Lexus</option>
                                        <option value="10">Mercedes-Benz</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field">
                                <div class="control buttons">
                                    <button class="button is-light">Cancel</button>
                                    <button class="button is-solid accent-button raised">Publish Story</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="column is-6">
                        <div class="story-upload">
                            <label for="file-input">Upload Video</label>
                            <input id="story-upload" type="file" accept=".jpg,.jpeg.,.gif,.png,.mov,.mp4" id="file-input" />
                            <br />
                            <!--p><strong>Select a video or image file</strong><br /><br />Supported browsers (tested): Chrome, Firefox, Safari, Opera, IE10, IE11, Android (Chrome), iOS Safari (10+)</p-->

                            <div id="preview">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
